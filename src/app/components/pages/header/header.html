<div class="container-header" [ngStyle]="{'background-color': isScrolled || headerWhite()? colorWhite: 'transparent', 'color': isScrolled ? colorPrimary : colorWhite }">
    <div class="container-header__hamburger" (click)="toggleMenu()">
        <mat-icon [ngStyle]="{'color': isScrolled || headerWhite() ? colorPrimary : '' }" aria-hidden="false" aria-label="Menú" fontIcon="menu"></mat-icon>
    </div>
    <div class="container-header__logo">
        <h1 [ngStyle]="{'color': isScrolled || headerWhite()? colorPrimary : '' }" aria-label="Nombre de la tienda" (click)="navigateToHome()"><span>V</span>IKINGO<span>T</span>ECH</h1>

    </div>
    <div class="container-header__actions">
        <mat-icon [ngStyle]="{'color': isScrolled || headerWhite() ? colorPrimary : '' }" aria-hidden="false" aria-label="Buscar" fontIcon="search"></mat-icon>
        @if(LoggeInService.isLoggedIn$ | async ){
          <mat-icon [ngStyle]="{'color': isScrolled || headerWhite() ? colorPrimary : '' }" aria-hidden="false" aria-label="Cerrar sesión" fontIcon="logout" (click)="confirmLogout()"></mat-icon>
        }
        @if(!(LoggeInService.isLoggedIn$ | async)){
          <mat-icon [ngStyle]="{'color': isScrolled || headerWhite() ? colorPrimary : '' }" aria-hidden="false" aria-label="Inicio de sesión" fontIcon="person" (click)="navigateToLogin()"></mat-icon>
        }
        <div class="container-header__actions--shoping">
            <mat-icon [ngStyle]="{'color': isScrolled || headerWhite() ? colorPrimary : '' }" aria-hidden="false" aria-label="Carrito de compras" fontIcon="shopping_cart" (click)="navigateToShoopingCart()"></mat-icon>
            <div class="point-shopping" [ngStyle]="{'display': shoopingCart() || cookie() === 'true' ? 'block' : 'none'}" ></div>
        </div>
        <img src="../../../../assets/images/vikingoTechimg.png" alt="vikingoTech">
    </div>
</div>

<div class="container-search">
    <i class="fa-solid fa-magnifying-glass"></i>
    <input type="text" placeholder="Buscar productos...">
</div>
